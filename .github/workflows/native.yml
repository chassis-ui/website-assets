name: Native

# On a change to the assets: the build of a release, compiled with the tools of each platform, as
# an app compiles it. A file that the source lint and the build pass can still fail there. Written
# by `chassis-assets init`, with a job per platform of chassis.build.
on:
  push:
    branches: [main]
    paths:
      - source/**
      - chassis.checks.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/native.yml
  pull_request:
    paths:
      - source/**
      - chassis.checks.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/native.yml

permissions:
  contents: read

jobs:
  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Fonts and images are Git LFS files
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:release

      # actool, of Xcode: the runner has it
      - name: Compile
        run: npx chassis-assets check-native --platform ios

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fonts and images are Git LFS files
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:release

      # aapt2, of the Android SDK: the runner has it
      - name: Compile
        run: npx chassis-assets check-native --platform android
