name: Release

# On a push, releases the version in package.json when it has no tag v<version> yet:
# builds every brand, app and platform, verifies the output and creates the tag and its GitHub
# release, whose body is the entry of the version in CHANGELOG.md, with the manifest and one
# archive per platform, app and brand attached:
# <name>-<platform>-<app>-<brand>-<version>.zip. A push that does not change the version
# releases nothing. Written by `chassis-assets init`.
#
# next is the prerelease channel: a push to next releases only a version with a prerelease part,
# such as 0.4.0-next.0, and a version without one waits for main.
on:
  push:
    branches: [main, next]

permissions:
  contents: read

# Never cancel a run that may be releasing. One group per branch: GitHub keeps one waiting run
# per group and cancels it for a newer one, so a push to next must not wait in the group of main
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      # No Git LFS files: only package.json is read
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the version has a tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # next releases only a prerelease. A version without a prerelease part waits for main
          if [ "$GITHUB_REF_NAME" = next ] && [ "${VERSION#*-}" = "$VERSION" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION has no prerelease part: next does not release it, main does"
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION exists: nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

  release:
    name: Release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the tag and the GitHub release
    steps:
      # Fonts and images are Git LFS files, and every download of one counts against the Git LFS
      # bandwidth of the owner of the repository. The checkout leaves pointers, and the objects
      # are cached by the list of their ids, so a run downloads only those that changed since the
      # cache it restores
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache the Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      # The token of the run, for this command only: the checkout keeps no credentials
      - name: Pull the Git LFS objects
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm .lfs-ids
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $AUTH" lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before anything else, so a version without a changelog entry is not released
      - name: Release notes
        run: npx chassis-assets release-notes > "$RUNNER_TEMP/release-notes.md"

      - name: Lint source
        run: pnpm lint

      - name: Build
        run: pnpm build:release

      - name: Verify
        run: pnpm verify

      # <name>-<platform>-<app>-<brand>-<version>.zip, the name and the version of package.json
      # and <name>-manifest-<version>.json, which `chassis-assets diff` reads for the next version
      - name: Archive each platform, app and brand
        run: |
          npx chassis-assets archive --to "$RUNNER_TEMP/archives"
          npx chassis-assets manifest --to "$RUNNER_TEMP/archives"

      # A version with a prerelease part, such as 0.2.0-next.0, is marked as a prerelease and
      # does not become the latest release
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) FLAGS=(--prerelease --latest=false) ;;
            *) FLAGS=(--latest) ;;
          esac

          gh release create "v$VERSION" \
            "$RUNNER_TEMP"/archives/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"
