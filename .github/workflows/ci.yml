name: CI

# On a push and on a pull request: the changelog, the source lint, the build and the
# verification of its output, with the commands of @chassis-ui/assets. Written by `chassis-assets init`.
on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fonts and images are Git LFS files, and every download of one counts against the Git LFS
      # bandwidth of the owner of the repository. The checkout leaves pointers, and the objects
      # are cached by the list of their ids, so a run downloads only those that changed since the
      # cache it restores
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Cache the Git LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      # The token of the run, for this command only: the checkout keeps no credentials
      - name: Pull the Git LFS objects
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm .lfs-ids
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $AUTH" lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails when the version of package.json has no entry in CHANGELOG.md
      - name: Check the changelog
        run: pnpm release-notes

      - name: Lint source
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify
        run: pnpm verify
